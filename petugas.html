<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadual Petugas | Gereja SDA Koporingan</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
/* ============ TOKENS ============ */
:root{
  --navy:#0b1d3a;
  --navy-2:#132a52;
  --gold:#c9a24b;
  --gold-soft:#e8d9b0;
  --cream:#faf6ec;
  --paper:#fffdf8;
  --ink:#241f16;
  --ink-soft:#6b6355;
  --line:#eae2ce;
  --red:#9a3324;
}

/* ============ RESET ============ */
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
html{ scroll-behavior:smooth; }
body{ background:var(--cream); color:var(--ink); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
.serif{ font-family:'Fraunces',serif; }

/* ============ NAVBAR (kept consistent with rest of site) ============ */
.navbar{ position:fixed; width:100%; top:0; padding:20px 0; background:rgba(11,29,58,0.95); backdrop-filter:blur(20px); z-index:1000; }
.nav-inner{ width:90%; max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center; }
.navbar img{ height:45px; }
.navbar ul{ list-style:none; display:flex; gap:25px; align-items:center; }
.navbar ul li a{ text-decoration:none; color:#fff; font-weight:500; font-size:14px; }
.menu-toggle{ display:none; font-size:28px; color:#fff; cursor:pointer; }

/* ============ HERO ============ */
.banner{
  padding:150px 0 60px;
  text-align:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(201,162,75,0.10), transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(11,29,58,0.06), transparent 40%),
    var(--paper);
  border-bottom:1px solid var(--line);
  position:relative;
}
.banner .eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  color:var(--gold); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2.5px;
}
.banner .eyebrow::before, .banner .eyebrow::after{ content:''; width:24px; height:1px; background:var(--gold); }
.banner h1{ font-family:'Fraunces'; font-size:40px; font-weight:600; color:var(--navy); margin-top:14px; letter-spacing:-0.5px; }
.banner .sub{ margin-top:10px; color:var(--ink-soft); font-size:14px; }

/* ============ SABBATH PICKER ============ */
.picker-container{ background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:85px; z-index:999; padding:16px 0; }
.sabbath-picker{ display:flex; gap:10px; overflow-x:auto; padding:0 5%; scrollbar-width:none; scroll-behavior:smooth; }
.sabbath-picker::-webkit-scrollbar{ display:none; }

.pill{
  flex:0 0 auto; padding:12px 22px; border-radius:10px;
  background:var(--cream); color:var(--navy);
  font-weight:700; font-size:13px; cursor:pointer; border:1px solid var(--line);
  transition:0.25s; position:relative; text-align:left; line-height:1.3;
}
.pill .pnum{ display:block; font-family:'Fraunces'; font-size:11px; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:1px; }
.pill.active{ background:var(--navy); border-color:var(--navy); color:#fff; box-shadow:0 10px 24px rgba(11,29,58,0.25); }
.pill.active .pnum{ color:var(--gold-soft); }
.pill.today::after{
  content:'HARI INI'; position:absolute; top:-9px; right:8px; background:var(--red); color:#fff;
  font-size:8px; font-weight:800; padding:2px 6px; border-radius:5px; letter-spacing:0.5px;
}

/* ============ SCHEDULE ============ */
.section{ padding:50px 0 90px; }
.container{ width:92%; max-width:1080px; margin:auto; }

.service-header{
  font-family:'Fraunces'; font-size:20px; font-weight:600; margin-bottom:22px;
  display:flex; align-items:baseline; gap:14px; color:var(--navy);
}
.service-header .time{ font-family:'Inter'; font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:0.5px; }
.service-header::after{ content:''; flex:1; height:1px; background:var(--line); }

.petugas-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; margin-bottom:44px; }
.card{
  background:var(--paper); border-radius:14px; padding:8px 28px;
  box-shadow:0 14px 30px rgba(11,29,58,0.05);
  border:1px solid var(--line); border-top:3px solid var(--gold);
}
.card.accent{ border-top:3px solid var(--red); }

.role-item{ display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px dashed var(--line); }
.role-item:last-child{ border-bottom:none; }
.role-icon{ width:38px; height:38px; flex:0 0 auto; background:var(--cream); border:1px solid var(--line); border-radius:9px; display:flex; justify-content:center; align-items:center; color:var(--navy); font-size:14px; }
.role-text{ min-width:0; }
.role-text span{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.6px; }
.role-text strong{ display:block; font-size:15px; color:var(--ink); font-weight:600; margin-top:2px; }

/* ============ STATES ============ */
.state-box{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.state-box i{ font-size:22px; color:var(--gold); margin-bottom:12px; display:block; }
.skeleton{ background:linear-gradient(90deg, var(--line) 25%, #f5f0e0 37%, var(--line) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px; height:16px; margin:8px 0; }
@keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }

/* ============ FOOTER ============ */
.footer{ text-align:center; padding:40px; color:var(--ink-soft); font-size:13px; background:var(--paper); border-top:1px solid var(--line); }
.footer .sync-note{ font-size:11px; margin-top:6px; opacity:0.75; }

@media (max-width:900px){
  .menu-toggle{ display:block; }
  .navbar ul{ position:absolute; top:75px; right:5%; background:rgba(11,29,58,0.98); backdrop-filter:blur(20px); width:220px; flex-direction:column; padding:25px; border-radius:16px; display:none; }
  .navbar ul.active{ display:flex; }
  .banner h1{ font-size:28px; }
  .petugas-grid{ grid-template-columns:1fr; }
  .picker-container{ top:81px; }
}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-inner">
    <img src="logo-sda.png" alt="Logo">
    <ul id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="sejarah.html">Sejarah</a></li>
      <li><a href="hubungi-kami.html">Hubungi</a></li>
    </ul>
    <div class="menu-toggle" id="menu-toggle">☰</div>
  </div>
</div>

<div class="banner">
  <span class="eyebrow" id="quarter-label">Memuatkan…</span>
  <h1>Jadual Petugas</h1>
  <p class="sub">Gereja SDA Koporingan</p>
</div>

<div class="picker-container">
  <div class="sabbath-picker" id="date-picker"></div>
</div>

<div class="section">
  <div class="container" id="schedule-content">
    <div class="state-box">
      <i class="fas fa-circle-notch fa-spin"></i>
      Sedang memuatkan jadual dari Google Sheet…
    </div>
  </div>
</div>

<footer class="footer">
  <p>© 2026–2027 Gereja SDA Koporingan</p>
  <p class="sync-note" id="sync-note">Jadual dikemaskini secara automatik dari Google Sheet.</p>
</footer>

<audio id="bg-music" autoplay loop><source src="music.mp3" type="audio/mpeg"></audio>

<script>
/* =========================================================================
   LIVE DATA SOURCE
   This page pulls its schedule directly from a Google Sheet that has been
   published to the web as CSV (File > Share > Publish to web > CSV).
   Editing the sheet updates this page automatically on next load/refresh.

   REQUIRED COLUMN HEADERS IN THE SHEET (row 1, spelled exactly like this):

   Tarikh              -> date, format YYYY-MM-DD (e.g. 2026-04-04)
   Label                -> optional, e.g. "Sabat 1". Auto-generated if left blank.

   Sekolah Sabat (09:45 AM):
   SS_PemimpinNyanyi
   SS_AcaraDoaPembuka
   SS_CeritaMisi
   SS_KesihatanKeluarga
   SS_Pianis
   SS_Media
   SS_JuruTulis

   Kebaktian Khotbah (11:00 AM):
   KH_Pengkhotbah
   KH_PemimpinAcara
   KH_DoaPembuka
   KH_Persembahan
   KH_Diakon
   KH_Pianis
   KH_Media
   KH_Istimewa

   Any extra columns in the sheet are simply ignored.
   ========================================================================= */

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTKbaGizmx7SFOiTMCXTw9cLDAO1mi4Sbgm2b-ynr3bucU45fXshQbFzFuAuM-xVfFvyz-UopoIOm8h/pub?gid=2033894049&single=true&output=csv";
const REFRESH_MS = 5 * 60 * 1000; // re-check the sheet every 5 minutes

let scheduleData = [];
let activeIndex = 0;

const MONTHS_MS = { "jan":0,"feb":1,"mac":2,"apr":3,"mei":4,"jun":5,"jul":6,"ogos":7,"sep":8,"okt":9,"nov":10,"dis":11 };

function getVal(row, key){
  // case/whitespace tolerant lookup
  if (row[key] !== undefined) return (row[key] || "").toString().trim();
  const found = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
  return found ? (row[found] || "").toString().trim() : "";
}

function formatShortDate(iso){
  const monthsShort = ["JAN","FEB","MAC","APR","MEI","JUN","JUL","OGOS","SEP","OKT","NOV","DIS"];
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return `${d.getDate()} ${monthsShort[d.getMonth()]}`;
}

function parseRows(rows){
  const clean = [];
  rows.forEach((row, i) => {
    const tarikh = getVal(row, "Tarikh");
    if (!tarikh) return; // skip blank rows
    clean.push({
      fullDate: tarikh,
      date: formatShortDate(tarikh),
      label: getVal(row, "Label") || `Sabat ${clean.length + 1}`,
      ss: {
        nyanyi: getVal(row, "SS_PemimpinNyanyi"),
        acara: getVal(row, "SS_AcaraDoaPembuka"),
        misi: getVal(row, "SS_CeritaMisi"),
        kesihatan: getVal(row, "SS_KesihatanKeluarga"),
        piano: getVal(row, "SS_Pianis"),
        media: getVal(row, "SS_Media"),
        tulis: getVal(row, "SS_JuruTulis"),
      },
      khotbah: {
        preacher: getVal(row, "KH_Pengkhotbah"),
        mc: getVal(row, "KH_PemimpinAcara"),
        doa: getVal(row, "KH_DoaPembuka"),
        persembahan: getVal(row, "KH_Persembahan"),
        diakon: getVal(row, "KH_Diakon"),
        piano: getVal(row, "KH_Pianis"),
        media: getVal(row, "KH_Media"),
        special: getVal(row, "KH_Istimewa"),
      }
    });
  });
  clean.sort((a,b) => new Date(a.fullDate) - new Date(b.fullDate));
  return clean;
}

function r(t, n, i){
  if (!n) return "";
  return `<div class="role-item"><div class="role-icon"><i class="fas ${i}"></i></div><div class="role-text"><span>${t}</span><strong>${n}</strong></div></div>`;
}

function renderSchedule(index){
  const data = scheduleData[index];
  if (!data) return;
  document.getElementById('schedule-content').innerHTML = `
    <div class="service-header">Sekolah Sabat <span class="time">09:45 AM</span></div>
    <div class="petugas-grid">
      <div class="card">
        ${r("Pemimpin Nyanyi & Doa Penutup", data.ss.nyanyi, "fa-microphone-lines")}
        ${r("Acara & Doa Pembuka", data.ss.acara, "fa-microphone")}
        ${r("Cerita Misi", data.ss.misi, "fa-earth-asia")}
      </div>
      <div class="card">
        ${r("Bacaan Keluarga & Kesihatan", data.ss.kesihatan, "fa-heart-pulse")}
        ${r("Pianis", data.ss.piano, "fa-music")}
        ${r("Media", data.ss.media, "fa-laptop-code")}
        ${r("Laporan & Jurutulis", data.ss.tulis, "fa-pen-nib")}
      </div>
    </div>
    <div class="service-header">Kebaktian Khotbah <span class="time">11:00 AM</span></div>
    <div class="petugas-grid">
      <div class="card accent">
        ${r("Pengkhotbah", data.khotbah.preacher, "fa-star")}
        ${r("Pemimpin Acara", data.khotbah.mc, "fa-user-tie")}
        ${r("Doa Pembuka", data.khotbah.doa, "fa-hands-praying")}
        ${r("Persembahan", data.khotbah.persembahan, "fa-hand-holding-heart")}
      </div>
      <div class="card">
        ${r("Diakon/Diakones", data.khotbah.diakon, "fa-user-shield")}
        ${r("Pianis", data.khotbah.piano, "fa-piano")}
        ${r("Media", data.khotbah.media, "fa-desktop")}
        ${r("Istimewa", data.khotbah.special, "fa-gift")}
      </div>
    </div>`;
}

function buildPicker(){
  const picker = document.getElementById('date-picker');
  picker.innerHTML = "";
  const today = new Date(); today.setHours(0,0,0,0);
  let autoSelect = 0;
  let closestDiff = Infinity;

  scheduleData.forEach((item, index) => {
    const btn = document.createElement('button');
    const itemDate = new Date(item.fullDate + "T00:00:00");
    const isToday = itemDate.getTime() === today.getTime();
    btn.className = 'pill' + (isToday ? ' today' : '');
    btn.innerHTML = `<span class="pnum">${item.label}</span>${item.date}`;

    const diff = itemDate - today;
    if (diff <= 0 && Math.abs(diff) < closestDiff){ closestDiff = Math.abs(diff); autoSelect = index; }
    else if (closestDiff === Infinity && diff > 0 && diff < closestDiff){ closestDiff = diff; autoSelect = index; }

    btn.onclick = () => {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeIndex = index;
      renderSchedule(index);
    };
    picker.appendChild(btn);
  });

  if (scheduleData.length){
    activeIndex = autoSelect;
    const activePill = picker.children[autoSelect];
    activePill.classList.add('active');
    renderSchedule(autoSelect);
    setTimeout(() => activePill.scrollIntoView({ behavior:'smooth', inline:'center' }), 100);
  }
}

function setQuarterLabel(){
  if (!scheduleData.length) return;
  const first = new Date(scheduleData[0].fullDate + "T00:00:00");
  const last = new Date(scheduleData[scheduleData.length - 1].fullDate + "T00:00:00");
  const monthsFull = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  document.getElementById('quarter-label').textContent =
    `${monthsFull[first.getMonth()]} – ${monthsFull[last.getMonth()]} ${last.getFullYear()}`;
}

function showError(msg){
  document.getElementById('schedule-content').innerHTML = `
    <div class="state-box">
      <i class="fas fa-triangle-exclamation"></i>
      ${msg}
    </div>`;
}

function loadSchedule(isBackgroundRefresh){
  Papa.parse(CSV_URL + "&_ts=" + Date.now(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results){
      const parsed = parseRows(results.data);
      if (!parsed.length){
        if (!isBackgroundRefresh) showError("Tiada jadual dijumpai buat masa ini. Sila semak semula Google Sheet.");
        return;
      }
      scheduleData = parsed;
      setQuarterLabel();
      buildPicker();
      document.getElementById('sync-note').textContent =
        "Jadual dikemaskini secara automatik dari Google Sheet • kemaskini terakhir: " + new Date().toLocaleTimeString('ms-MY');
    },
    error: function(){
      if (!isBackgroundRefresh) showError("Gagal memuatkan jadual. Sila semak sambungan internet anda.");
    }
  });
}

loadSchedule(false);
setInterval(() => loadSchedule(true), REFRESH_MS);

document.getElementById("menu-toggle").addEventListener("click", () => document.getElementById("nav-links").classList.toggle("active"));
const bgMusic = document.getElementById('bg-music');
document.addEventListener('click', () => { if (bgMusic.paused) bgMusic.play(); });
</script>
</body>
</html>
