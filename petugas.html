<style>
/* RESET & CORE STYLE */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background: #fbfbfd; color: #1d1d1f; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

/* NAVBAR */
.navbar { position: fixed; width: 100%; top: 0; padding: 20px 0; background: rgba(11, 29, 58, 0.95); backdrop-filter: blur(20px); z-index: 1000; }
.nav-inner { width: 90%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
.navbar img { height: 45px; }
.navbar ul { list-style: none; display: flex; gap: 25px; align-items: center; }
.navbar ul li a { text-decoration: none; color: white; font-weight: 500; font-size: 14px; }
.menu-toggle { display: none; font-size: 28px; color: white; cursor: pointer; }

/* BANNER */
.banner { padding-top: 140px; padding-bottom: 40px; text-align: center; background: #fff; }
.banner h1 { font-family: 'Montserrat'; font-size: 32px; font-weight: 800; color: #0b1d3a; text-transform: uppercase; }
.banner p { color: #86868b; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

/* SABBATH PICKER (HORIZONTAL SCROLL) */
.picker-container { background: #fff; border-bottom: 1px solid #f2f2f2; position: sticky; top: 85px; z-index: 999; padding: 15px 0; }
.sabbath-picker { display: flex; gap: 12px; overflow-x: auto; padding: 0 5%; scrollbar-width: none; scroll-behavior: smooth; }
.sabbath-picker::-webkit-scrollbar { display: none; }

.pill { 
    flex: 0 0 auto; padding: 10px 24px; border-radius: 50px; background: #f5f5f7; 
    color: #1d1d1f; font-weight: 700; font-size: 13px; cursor: pointer; border: none; transition: 0.3s; 
}
.pill.active { background: #0b1d3a; color: #fff; transform: scale(1.05); box-shadow: 0 8px 20px rgba(11, 29, 58, 0.2); }

/* SERVICE CARDS */
.section { padding: 40px 0 80px; }
.container { width: 92%; max-width: 1100px; margin: auto; }
.service-header { font-family: 'Montserrat'; font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

.petugas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
.card { background: #fff; border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #f2f2f2; }

.role-item { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f9f9fb; }
.role-item:last-child { border-bottom: none; }
.role-icon { width: 40px; height: 40px; background: #f5f5f7; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #0b1d3a; font-size: 16px; }
.role-text span { display: block; font-size: 11px; color: #86868b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.role-text strong { display: block; font-size: 15px; color: #1d1d1f; }

/* FOOTER */
.footer { text-align: center; padding: 40px; color: #86868b; font-size: 13px; background: #fff; border-top: 1px solid #f2f2f2; }

@media (max-width: 900px) {
    .menu-toggle { display: block; }
    .navbar ul { position: absolute; top: 75px; right: 5%; background: rgba(11, 29, 58, 0.98); backdrop-filter: blur(20px); width: 220px; flex-direction: column; padding: 25px; border-radius: 16px; display: none; }
    .navbar ul.active { display: flex; }
    .banner h1 { font-size: 24px; }
    .petugas-grid { grid-template-columns: 1fr; }
}

function renderSchedule(index) {
    const data = scheduleData[index];

                ${r("Istimewa", data.khotbah.special, "fa-gift")}
            </div>
        </div>`;
}

function r(t, n, i) { return `<div class="role-item"><div class="role-icon"><i class="fas ${i}"></i></div><div class="role-text"><span>${t}</span><strong>${n}</strong></div></div>`; }

const picker = document.getElementById('date-picker');
const today = new Date();
let autoSelect = 0;

scheduleData.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.innerHTML = item.date;
    const itemDate = new Date(item.fullDate);
    if (itemDate <= today) autoSelect = index;
    btn.onclick = () => {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        renderSchedule(index);
    };
    picker.appendChild(btn);
});

const activePill = picker.children[autoSelect];
activePill.click();
activePill.scrollIntoView({ behavior: 'smooth', inline: 'center' });

document.getElementById("menu-toggle").addEventListener("click", () => document.getElementById("nav-links").classList.toggle("active"));
