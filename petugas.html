<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadual Petugas | Gereja SDA Koporingan</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
/* RESET & CORE STYLE */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background: #fbfbfd; color: #1d1d1f; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

/* NAVBAR */
.navbar { position: fixed; width: 100%; top: 0; padding: 20px 0; background: rgba(11, 29, 58, 0.95); backdrop-filter: blur(20px); z-index: 1000; }
.nav-inner { width: 90%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
.navbar img { height: 45px; }
.navbar ul { list-style: none; display: flex; gap: 25px; align-items: center; }
.navbar ul li a { text-decoration: none; color: white; font-weight: 500; font-size: 14px; }
.menu-toggle { display: none; font-size: 28px; color: white; cursor: pointer; }

/* BANNER */
.banner { padding-top: 140px; padding-bottom: 40px; text-align: center; background: #fff; }
.banner h1 { font-family: 'Montserrat'; font-size: 32px; font-weight: 800; color: #0b1d3a; text-transform: uppercase; }
.banner p { color: #86868b; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

/* SABBATH PICKER (HORIZONTAL SCROLL) */
.picker-container { background: #fff; border-bottom: 1px solid #f2f2f2; position: sticky; top: 85px; z-index: 999; padding: 15px 0; }
.sabbath-picker { display: flex; gap: 12px; overflow-x: auto; padding: 0 5%; scrollbar-width: none; scroll-behavior: smooth; }
.sabbath-picker::-webkit-scrollbar { display: none; }

.pill { 
    flex: 0 0 auto; padding: 10px 24px; border-radius: 50px; background: #f5f5f7; 
    color: #1d1d1f; font-weight: 700; font-size: 13px; cursor: pointer; border: none; transition: 0.3s; 
}
.pill.active { background: #0b1d3a; color: #fff; transform: scale(1.05); box-shadow: 0 8px 20px rgba(11, 29, 58, 0.2); }

/* SERVICE CARDS */
.section { padding: 40px 0 80px; }
.container { width: 92%; max-width: 1100px; margin: auto; }
.service-header { font-family: 'Montserrat'; font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

.petugas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
.card { background: #fff; border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #f2f2f2; }

.role-item { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f9f9fb; }
.role-item:last-child { border-bottom: none; }
.role-icon { width: 40px; height: 40px; background: #f5f5f7; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #0b1d3a; font-size: 16px; }
.role-text span { display: block; font-size: 11px; color: #86868b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.role-text strong { display: block; font-size: 15px; color: #1d1d1f; }

/* LOADING & ERROR STATES */
.status-msg { text-align: center; font-size: 16px; font-weight: 600; color: #86868b; padding: 40px 0; }

/* FOOTER */
.footer { text-align: center; padding: 40px; color: #86868b; font-size: 13px; background: #fff; border-top: 1px solid #f2f2f2; }

@media (max-width: 900px) {
    .menu-toggle { display: block; }
    .navbar ul { position: absolute; top: 75px; right: 5%; background: rgba(11, 29, 58, 0.98); backdrop-filter: blur(20px); width: 220px; flex-direction: column; padding: 25px; border-radius: 16px; display: none; }
    .navbar ul.active { display: flex; }
    .banner h1 { font-size: 24px; }
    .petugas-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="navbar">
    <div class="nav-inner">
        <img src="logo-sda.png" alt="Logo">
        <ul id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="sejarah.html">Sejarah</a></li>
            <li><a href="hubungi-kami.html">Hubungi</a></li>
        </ul>
        <div class="menu-toggle" id="menu-toggle">☰</div>
    </div>
</div>

<div class="banner">
    <p>Suku Ke-3 (Julai – September 2026)</p>
    <h1>Jadual Petugas</h1>
</div>

<div class="picker-container">
    <div class="sabbath-picker" id="date-picker">
        <div class="status-msg">Memuatkan jadual dari Google Sheets...</div>
    </div>
</div>

<div class="section">
    <div class="container" id="schedule-content">
        <div class="status-msg">Sila tunggu sebentar...</div>
    </div>
</div>

<footer class="footer">
    <p>© 2026–2027 Gereja SDA Koporingan | Dikemaskini Automatik</p>
</footer>

<audio id="bg-music" autoplay loop><source src="music.mp3" type="audio/mpeg"></audio>

<script>
/* ================= API LINKS FOR GOOGLE SHEETS ================= */
const SS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVPEOB6hYheFOpY542K8yXu_5AVdZMV5nO-v5Gph-I4wJZJHDgmEi7uNJhN2DI0g/pub?gid=546730745&single=true&output=csv";
const KHOTBAH_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVPEOB6hYheFOpY542K8yXu_5AVdZMV5nO-v5Gph-I4wJZJHDgmEi7uNJhN2DI0g/pub?gid=382933480&single=true&output=csv";

let globalScheduleData = [];

/* ================= ENGINE ================= */
function parseCSV(text) {
    let rows = [], row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
        let c = text[i], n = text[i+1];
        if (c === '"') {
            if (inQ && n === '"') { cell += '"'; i++; }
            else { inQ = !inQ; }
        } else if (c === ',' && !inQ) {
            row.push(cell.trim()); cell = '';
        } else if ((c === '\n' || c === '\r') && !inQ) {
            if (c === '\r' && n === '\n') i++;
            row.push(cell.trim()); rows.push(row);
            row = []; cell = '';
        } else { cell += c; }
    }
    if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
    return rows;
}

function parseSmartDate(dayStr, monthStr) {
    const cleanDay = parseInt((dayStr||"").replace(/[^\d]/g, '')) || 1;
    let month = 6; 
    let mText = (monthStr || "").toUpperCase();
    
    if(mText.includes('JAN')) month = 0; else if(mText.includes('FEB')) month = 1;
    else if(mText.includes('MAC')||mText.includes('MAR')) month = 2; else if(mText.includes('APR')) month = 3;
    else if(mText.includes('MEI')||mText.includes('MAY')) month = 4; else if(mText.includes('JUN')) month = 5;
    else if(mText.includes('JUL')) month = 6; else if(mText.includes('OGO')||mText.includes('AUG')) month = 7;
    else if(mText.includes('SEP')) month = 8; else if(mText.includes('OKT')||mText.includes('OCT')) month = 9;
    else if(mText.includes('NOV')) month = 10; else if(mText.includes('DIS')||mText.includes('DEC')) month = 11;
    
    return new Date(2026, month, cleanDay);
}

async function loadLiveSchedule() {
    try {
        const [ssResponse, khotbahResponse] = await Promise.all([
            fetch(SS_CSV_URL),
            fetch(KHOTBAH_CSV_URL)
        ]);
        
        const ssText = await ssResponse.text();
        const khotbahText = await khotbahResponse.text();
        
        const ssRows = parseCSV(ssText).filter(r => r[2] && !r[2].toUpperCase().includes("TARIKH"));
        const kRows = parseCSV(khotbahText).filter(r => r[2] && !r[2].toUpperCase().includes("TARIKH"));

        globalScheduleData = [];

        for (let i = 0; i < ssRows.length; i++) {
            let rS = ssRows[i];
            let rK = kRows.find(r => r[3] === rS[3]) || kRows[i] || [];

            let daySS = rS[2] || "";
            let monthSS = rS[1] || "JULAI";
            let realJsDate = parseSmartDate(daySS, monthSS);

            let laporan = rS[10] ? rS[10].trim() : "";
            let jurutulis = rS[11] ? rS[11].trim() : "";
            let gabunganTulis = laporan;
            if (jurutulis && jurutulis !== "-") gabunganTulis += (laporan ? " & " : "") + jurutulis;

            let diakon1 = rK[7] ? rK[7].trim() : "";
            let diakon2 = rK[8] ? rK[8].trim() : "";
            let gabunganDiakon = diakon1;
            if (diakon2 && diakon2 !== "-") gabunganDiakon += (diakon1 ? " & " : "") + diakon2;
            
            globalScheduleData.push({
                date: daySS + " " + monthSS.substring(0,3).toUpperCase(),
                fullDate: realJsDate,
                label: "Sabat " + (rS[3] || (i+1)),
                ss: {
                    nyanyi: (rS[4]||"-").replace(/\n/g, ' / '),
                    acara: (rS[5]||"-").replace(/\n/g, ' / '),
                    misi: (rS[6]||"-").replace(/\n/g, ' / '),
                    kesihatan: (rS[7]||"-").replace(/\n/g, ' / '),
                    piano: (rS[8]||"-").replace(/\n/g, ' / '),
                    media: (rS[9]||"-").replace(/\n/g, ' / '),
                    tulis: gabunganTulis.replace(/\n/g, ' / ') || "-"
                },
                khotbah: {
                    mc: (rK[4]||"-").replace(/\n/g, ' / '),
                    doa_persembahan: (rK[5]||"-").replace(/\n/g, ' / '),
                    doa: (rK[6]||"-").replace(/\n/g, ' / '),
                    diakon: gabunganDiakon.replace(/\n/g, ' / ') || "-",
                    preacher: (rK[9]||"-").replace(/\n/g, ' / '),
                    special: (rK[10]||"-").replace(/\n/g, ' / '),
                    piano: (rK[11]||"-").replace(/\n/g, ' / '),
                    media: (rK[12]||"-").replace(/\n/g, ' / ')
                }
            });
        }

        buildDatePicker();
    } catch (error) {
        console.error(error);
        document.getElementById('date-picker').innerHTML = `<div class="status-msg" style="color:#d63b3b;">Sistem gagal menyambung ke Google Sheets.</div>`;
    }
}

function buildDatePicker() {
    const picker = document.getElementById('date-picker');
    picker.innerHTML = '';
    
    const today = new Date();
    today.setHours(0,0,0,0);
    let autoSelect = 0;

    for (let i = 0; i < globalScheduleData.length; i++) {
        if (globalScheduleData[i].fullDate >= today) {
            autoSelect = i;
            break;
        }
    }

    globalScheduleData.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'pill';
        btn.innerHTML = item.date;
        if (index === autoSelect) btn.classList.add('active');
        
        btn.onclick = () => {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderSchedule(index);
        };
        picker.appendChild(btn);
    });

    if (picker.children.length > 0) {
        const activePill = picker.children[autoSelect];
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        renderSchedule(autoSelect);
    }
}

function renderSchedule(index) {
    const data = globalScheduleData[index];
    document.getElementById('schedule-content').innerHTML = `
        <div class="service-header" style="color:#0071e3;"><i class="fas fa-sun"></i> Sekolah Sabat (09:45 AM)</div>
        <div class="petugas-grid">
            <div class="card">
                ${r("Pemimpin Nyanyi & Doa Penutup S.Sabat", data.ss.nyanyi, "fa-microphone-lines")}
                ${r("Pemimpin Acara & Doa Pembuka", data.ss.acara, "fa-microphone")}
                ${r("Cerita Misi", data.ss.misi, "fa-earth-asia")}
            </div>
            <div class="card">
                ${r("Bacaan Keluarga & Kesihatan", data.ss.kesihatan, "fa-heart-pulse")}
                ${r("Pianist", data.ss.piano, "fa-piano")}
                ${r("Media", data.ss.media, "fa-laptop-code")}
                ${r("Laporan & Jurutulis", data.ss.tulis, "fa-pen-nib")}
            </div>
        </div>
        <div class="service-header" style="color:#d63b3b;"><i class="fas fa-church"></i> Kebaktian Khotbah (11:00 AM)</div>
        <div class="petugas-grid">
            <div class="card" style="border-left: 5px solid #d63b3b;">
                ${r("Pengkhotbah", data.khotbah.preacher, "fa-star")}
                ${r("Pemimpin Acara", data.khotbah.mc, "fa-user-tie")}
                ${r("Doa Pembuka", data.khotbah.doa, "fa-hands-praying")}
                ${r("Doa Persembahan", data.khotbah.doa_persembahan, "fa-hand-holding-heart")}
            </div>
            <div class="card">
                ${r("Diakon/Diakones", data.khotbah.diakon, "fa-user-shield")}
                ${r("Pianist", data.khotbah.piano, "fa-music")}
                ${r("Media", data.khotbah.media, "fa-desktop")}
                ${r("Istimewa", data.khotbah.special, "fa-gift")}
            </div>
        </div>`;
}

function r(t, n, i) { return `<div class="role-item"><div class="role-icon"><i class="fas ${i}"></i></div><div class="role-text"><span>${t}</span><strong>${n}</strong></div></div>`; }

window.addEventListener('load', loadLiveSchedule);

document.getElementById("menu-toggle").addEventListener("click", () => document.getElementById("nav-links").classList.toggle("active"));
const bgMusic = document.getElementById('bg-music');
document.addEventListener('click', () => { if (bgMusic.paused) bgMusic.play(); });
</script>
</body>
</html>
